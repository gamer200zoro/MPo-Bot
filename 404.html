<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ServerOS</title>
  <script>
    // GitHub Pages SPA redirect: encode the path into the query string
    // then index.html reads it back and restores the URL.
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1).join('/') +
      '/?p=' + encodeURIComponent(l.pathname + l.search) +
      (l.hash || '')
    );
  </script>
</head>
<body></body>
</html>
